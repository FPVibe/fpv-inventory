name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Check formatting
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno test --allow-all

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
      has_rtappstore_pat: ${{ steps.check-pat.outputs.has_pat }}

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Check RTAPPSTORE_PAT availability
        id: check-pat
        run: echo "has_pat=${{ secrets.RTAPPSTORE_PAT != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin docker-compose.yml to new image tag
        run: |
          SHORT_SHA=${{ steps.version.outputs.short_sha }}
          sed -i "s|image: ghcr.io/fpvibe/fpv-inventory:.*|image: ghcr.io/fpvibe/fpv-inventory:sha-${SHORT_SHA}|" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git diff --staged --quiet || git commit -m "chore: pin docker-compose to sha-${SHORT_SHA} [skip ci]"
          git push

  update-appstore:
    needs: docker
    # Skip gracefully when RTAPPSTORE_PAT is not configured in repository secrets.
    # Note: secrets context is not available in job-level if conditions; the boolean
    # is computed in a docker job step and passed via needs output instead.
    if: needs.docker.outputs.has_rtappstore_pat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          repository: cori/rtappstore
          token: ${{ secrets.RTAPPSTORE_PAT }}

      - name: Update fpv-inventory version
        id: version
        env:
          VERSION: ${{ needs.docker.outputs.short_sha }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Update config.json: bump tipi_version and set version (use sha- prefix to match image tag)
          jq --arg version "sha-$VERSION" \
             --argjson tipi_version "$(jq '.tipi_version + 1' apps/fpv-inventory/config.json)" \
             '.version = $version | .tipi_version = $tipi_version' \
             apps/fpv-inventory/config.json > apps/fpv-inventory/config.json.tmp && \
            mv apps/fpv-inventory/config.json.tmp apps/fpv-inventory/config.json

          # Update docker-compose.json image tag (handles legacy cori/ owner name too)
          sed -i "s|ghcr\.io/[a-z0-9_-]*/fpv-inventory:sha-[a-f0-9]*|ghcr.io/fpvibe/fpv-inventory:sha-$VERSION|g" \
            apps/fpv-inventory/docker-compose.json

          echo "tipi_version=$(jq -r '.tipi_version' apps/fpv-inventory/config.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate with bun test
        run: |
          bun install
          bun test

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.RTAPPSTORE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.docker.outputs.short_sha }}"
          BRANCH="update-fpv-inventory-${VERSION}"
          git checkout -b "$BRANCH"

          git add apps/fpv-inventory/config.json apps/fpv-inventory/docker-compose.json
          git commit -m "app: update fpv-inventory to sha-${VERSION} (auto from push)"

          git push origin "$BRANCH"

          gh pr create \
            --repo cori/rtappstore \
            --base main \
            --head "$BRANCH" \
            --title "app: update fpv-inventory to sha-${VERSION} (auto)" \
            --body "Automated update from fpv-inventory push to main.

          - Version: sha-${VERSION}
          - tipi_version: ${{ steps.version.outputs.tipi_version }}
          - Image: ghcr.io/fpvibe/fpv-inventory:sha-${VERSION}

          All validation tests pass."
